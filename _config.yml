# ───────────────────────────────────────────────
#  site settings. github rebuilds the site about a
#  minute after you save a change here.
# ───────────────────────────────────────────────

name: Thomas Ni
author: Thomas Ni
description: Thomas Ni, a student at Stanford Online High School.

# the card on the left of every page
profile:
  photo: assets/img/thomas.jpg
  role: Student
  school: Stanford Online High School
  email: thomasni@ohs.stanford.edu
  links:
    - label: Email
      url: mailto:thomasni@ohs.stanford.edu
      icon: mail
    - label: GitHub
      url: https://github.com/MathCosine
      icon: github
    - label: Blog (Art of Problem Solving)
      url: https://artofproblemsolving.com/community/c4146707
      icon: blog

# the links in the red bar at the top, in order.
# "/#something" jumps to that section of the home page;
# a full https:// link opens in a new tab.
nav:
  - title: About
    url: /#about
  - title: Highlights
    url: /#highlights
  - title: Research
    url: /#research
  - title: Notes
    url: /notes/
  - title: Blog
    url: https://artofproblemsolving.com/community/c4146707
  - title: Contact
    url: /#contact

# the Contact section at the bottom of the home page.
# "email" is shown as name (at) domain so spam bots can't read it easily.
contact:
  - label: Primary Email
    email: thomasni@ohs.stanford.edu
  - label: Email
    email: mathtomn@gmail.com
  - label: Discord
    text: mathcosine
  - label: GitHub
    text: MathCosine
    url: https://github.com/MathCosine
  - label: Blog
    text: Art of Problem Solving
    url: https://artofproblemsolving.com/community/c4146707

# the site lives at mathcosine.github.io (the repo is named mathcosine.github.io).
# if it ever moves to a repo with another name, set baseurl to "/that-name"
url: https://mathcosine.github.io
baseurl: ""

timezone: America/Los_Angeles

# ── you shouldn't need to touch anything below ──
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

exclude:
  - README.md
  - HOW-TO-EDIT.md
  - Gemfile
  - Gemfile.lock
  - vendor
