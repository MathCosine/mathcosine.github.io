{%- comment -%}
  a password-locked block. use: {% include locked.html name="achievements" %}
  the scrambled text lives in _data/locked.yml under the same name.
{%- endcomment -%}
{%- assign blob = site.data.locked[include.name] -%}
<div class="locked" data-block="{{ include.name }}" data-blob="{{ blob | escape }}">
<form class="unlock locked-cover">
<label for="pw-{{ include.name }}">{{ include.hint | default: "This section is password-protected." }}</label>
<div class="unlock-row"><input type="password" id="pw-{{ include.name }}" placeholder="Password" autocomplete="current-password" required><button class="btn" type="submit">Unlock</button></div>
<p class="unlock-msg" aria-live="polite"></p>
</form>
<div class="locked-content prose" hidden></div>
</div>
