<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" -%}
<title>{{ site.name }}</title>
{%- else -%}
<title>{{ page.title }} · {{ site.name }}</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
{%- if page.noindex %}
<meta name="robots" content="noindex">
{%- endif %}
<meta name="author" content="{{ site.author | default: site.name }}">
<meta property="og:title" content="{{ page.title | default: site.name }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.profile.photo | absolute_url }}">
<meta name="theme-color" content="#8c1515">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Code+Pro:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="{{ '/assets/js/vendor/marked.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/lock.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
